# Veröffentlicht die Oberfläche (html/) auf GitHub Pages.
#
# Ohne diesen Workflow bleibt die zuletzt gebaute Seite stehen: GitHub Pages
# mit der Quelle "GitHub Actions" baut nur, wenn ein Workflow das Artefakt
# hochlädt. Genau daran hing die veraltete Seite mit leerem DEMO_API.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: html

      - id: deployment
        uses: actions/deploy-pages@v4
