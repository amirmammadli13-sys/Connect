services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://connect_user:${POSTGRES_PASSWORD:-connect_password}@db:5432/connect_db
      AI_SERVICE_URL: http://ai-service:8001
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  ai-service:
    build: ./ai
    restart: unless-stopped
    ports:
      - "8001:8001"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: connect_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connect_password}
      POSTGRES_DB: connect_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect_user -d connect_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  db_data:
